<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="8" viewBox="0 0 1000 8" role="img" aria-label="Divider">
<title>Divider</title>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B4E61D"/><stop offset="1" stop-color="#7C3AED"/></linearGradient><filter id="glow" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<style></style>
<rect y="2" width="1000" height="4" rx="2" fill="url(#g)" opacity=".5"/>
<rect y="2" width="160" height="4" rx="2" fill="#C9F54A" filter="url(#glow)" opacity=".95"><animate attributeName="x" from="-160" to="1000" dur="4.5s" repeatCount="indefinite"/></rect>
</svg>
