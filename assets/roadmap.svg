<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="310" viewBox="0 0 960 310" role="img" aria-label="Build plan for LWP SQL-GPT 1.0: six sprints from 19 October 2026 to 10 January 2027: setup, data and tokenizer, transformer, training, SQL and evaluation, release.">
<title>Build plan for LWP SQL-GPT 1.0: six sprints from 19 October 2026 to 10 January 2027: setup, data and tokenizer, transformer, training, SQL and evaluation, release.</title>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B4E61D"/><stop offset="1" stop-color="#7C3AED"/></linearGradient></defs>
<style>.f{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}@keyframes halo{0%{r:17;opacity:.9}60%,100%{r:31;opacity:0}}.halo{animation:halo 3.6s ease-out infinite}
@keyframes flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-28}}.flow{stroke-dasharray:10 18;animation:flow 1.4s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect width="960" height="310" rx="18" fill="#1B0E30"/><rect x=".5" y=".5" width="959" height="309" rx="18" fill="none" stroke="#2A1650"/>
