<circle cx="865" cy="110" r="17" fill="#B4E61D"/>
<text class="f" x="865" y="116" text-anchor="middle" fill="#0E0518" style="font-size:15px;font-weight:800">6</text>
<text class="f" x="865" y="160" text-anchor="middle" fill="#B4E61D" style="font-size:12px;font-weight:700;letter-spacing:2.5px">SPRINT 6</text>
