<text class="f" x="865" y="236" text-anchor="middle" fill="#CFC8E6" style="font-size:13px">demo, docs,</text>
<text class="f" x="865" y="253" text-anchor="middle" fill="#CFC8E6" style="font-size:13px">final results</text>
<text class="f" x="480.0" y="290" text-anchor="middle" fill="#A78BFA" style="font-size:13px;font-style:italic">Planned schedule. Real results are shared as each milestone is completed.</text>
